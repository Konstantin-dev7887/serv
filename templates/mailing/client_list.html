{% extends 'base.html' %}
{% block content %}
<h1>Клиенты</h1>
<a href="{% url 'mailing:client_create' %}" class="btn btn-primary mb-3">Добавить клиента</a>
<table class="table">
  <thead><tr><th>Email</th><th>ФИО</th><th></th></tr></thead>
  <tbody>
  {% for client in clients %}
    <tr>
      <td>{{ client.email }}</td><td>{{ client.full_name }}</td>
      <td>
        <a href="{% url 'mailing:client_detail' client.pk %}" class="btn btn-sm btn-info">Просмотр</a>
        <a href="{% url 'mailing:client_update' client.pk %}" class="btn btn-sm btn-warning">Изменить</a>
        <a href="{% url 'mailing:client_delete' client.pk %}" class="btn btn-sm btn-danger">Удалить</a>
      </td>
    </tr>
  {% empty %}<tr><td colspan="3">Нет клиентов</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
