{% extends 'base.html' %}

{% block content %}
<h1>Сообщения</h1>
<a href="{% url 'mailing:message_create' %}" class="btn btn-primary mb-3">Создать сообщение</a>

<table class="table table-striped">
    <thead>
        <tr><th>Тема</th><th>Действия</th></tr>
    </thead>
    <tbody>
        {% for message in messages_list %}
        <tr>
            <td>{{ message.subject }}</td>
            <td>
                <a href="{% url 'mailing:message_detail' message.pk %}" class="btn btn-sm btn-info">Просмотр</a>
                <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-sm btn-warning">Изменить</a>
                <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-sm btn-danger">Удалить</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="2">У вас пока нет сообщений.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

</html>
