{% extends 'base.html' %}

{% block content %}
<h1>Удалить рассылку #{{ object.id }}?</h1>
<p>Вы уверены? Это действие нельзя отменить.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'mailing:mailing_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
